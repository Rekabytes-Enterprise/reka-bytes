name: Release — GHCR images

# Push a tag like `v0.1.0` → builds backend / frontend / admin images and
# pushes them to GHCR for Coolify deployment:
#
#   ghcr.io/rekabytes-enterprise/reka-bytes-backend  (:4300)
#   ghcr.io/rekabytes-enterprise/reka-bytes-frontend (:4301)
#   ghcr.io/rekabytes-enterprise/reka-bytes-admin    (:4302)
#
# Tag pattern produces: v0.1.0, 0.1.0, 0.1, latest.
# NOTE: the first push creates the GHCR packages as PRIVATE — flip to public
# under the repo's Packages settings if you want anonymous pulls.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR image paths must be lowercase
      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/reka-bytes-${{ matrix.app }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=reka-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=reka-${{ matrix.app }}
