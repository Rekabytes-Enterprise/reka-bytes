services:
  postgres:
    image: postgres:17-alpine
    container_name: reka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reka_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rekabytes}
    ports:
      - '5433:5432'
    volumes:
      - reka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-reka} -d ${POSTGRES_DB:-rekabytes}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reka-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - reka_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reka_pgdata:
  reka_redisdata:
